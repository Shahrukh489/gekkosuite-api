services:
  db:
    image: postgres:15.18-trixie
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: gekkosuite
    ports:
      - 5432:5432
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: g-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@g.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"